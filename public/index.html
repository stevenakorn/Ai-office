<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 視覺辦公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: night-shift office — command bar, isometric floor, staff cards; output rail on the right */
  --bg:#0c0d11;
  --panel:#15171d;
  --line:#262934;
  --ink:#e9e7e2;
  --muted:#8b8f9c;
  --accent:#ff5b4f;
  --ok:#4fd1a9; --work:#5aa2ff; --warn:#ffb547; --stuck:#ff5b4f;
  --body:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--work);outline-offset:2px}
#app{max-width:1320px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.mode{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-left:8px;font-weight:400}
.mode.live{color:var(--ok);border-color:#24493f}
#needYou{background:var(--stuck);color:#fff;border:0;border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,91,79,.25)}}
form.cmd{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.cmd label{font-size:12px;color:var(--muted);white-space:nowrap}
.cmd input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:8px 4px}
#dispatch{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
#dispatch:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{background:transparent;border:1px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.chips button:hover{color:var(--ink);border-color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.stage{position:relative;background:radial-gradient(ellipse at 50% 40%,#181a22 0%,#0c0d11 70%);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#office{display:block;width:100%;height:auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:#3a3e4c}
.card.active{border-color:var(--work)}
.card.stuck{border-color:var(--stuck);box-shadow:0 0 0 1px var(--stuck) inset}
.card .who{display:flex;align-items:center;gap:8px}
.card canvas{width:30px;height:30px;border-radius:7px;image-rendering:pixelated;flex:none}
.card .nm{font-weight:700;line-height:1.2}
.card .rl{font-size:11px;color:var(--muted)}
.card .st{display:flex;align-items:center;gap:6px;font-size:12px}
.card .tk{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:#22252e;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--work);transition:width .3s}
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.panel h2{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:#1d2028;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.tabs button.on{color:var(--ink);border-color:var(--work)}
#out{max-height:46vh;overflow:auto;font-size:13px;padding-right:4px}
#out h1,#out h2,#out h3,#out h4{font-size:14px;margin:12px 0 4px;text-wrap:balance}
#out p{margin:6px 0}
#out ul,#out ol{margin:4px 0;padding-left:20px}
#out table{border-collapse:collapse;font-size:12px;margin:6px 0;display:block;overflow-x:auto}
#out td,#out th{border:1px solid var(--line);padding:3px 6px;vertical-align:top}
#out code{font-family:var(--mono);font-size:12px;background:#1d2028;padding:0 4px;border-radius:4px}
.empty{color:var(--muted);font-size:13px}
#copy{background:transparent;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
#log{list-style:none;margin:0;padding:0;max-height:28vh;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:4px}
#log li{display:flex;gap:8px}
#log time{font-family:var(--mono);color:var(--muted);flex:none}
#log b{font-weight:700}
#wire{position:fixed;inset:0;pointer-events:none;width:100vw;height:100vh;z-index:5}
#modal,.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal[hidden],.ovl[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--stuck);border-radius:14px;padding:16px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font-size:15px}
.dlg p{margin:0;color:var(--ink)}
.dlg textarea{background:#0f1116;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:80px;resize:vertical}
.dlg .row{display:flex;justify-content:flex-end;gap:8px}
.dlg button{border-radius:8px;padding:6px 14px;border:1px solid var(--line);background:transparent;cursor:pointer}
.dlg button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.hdr-r{display:flex;gap:8px;align-items:center}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.ghost:hover{border-color:var(--muted)}
.card .mdl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:var(--mono);min-width:0}
.card .mdl span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg.wide{width:min(620px,100%);border-color:var(--line);max-height:90vh;overflow:auto}
.sgrid{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center}
.sgrid label,.sname{display:flex;flex-direction:column;font-size:13px}
.sgrid small,.sname small{color:var(--muted);font-size:11px}
.dlg input,.dlg select{background:#0f1116;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
#sAgents{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.mcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.mcell select,.mcell input{width:100%}
.srow{display:grid;grid-template-columns:110px 170px 1fr;gap:8px;align-items:center}
.sname{flex-direction:row;align-items:center;gap:6px;font-weight:700}
.sname small{font-weight:400}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){.srow{grid-template-columns:1fr 1fr}.sname{grid-column:1/-1}.sgrid{grid-template-columns:1fr}}
#tv{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:auto;box-shadow:0 0 30px rgba(90,162,255,.25)}
[hidden]{display:none!important}
#tv[hidden],.tvbar[hidden]{display:none}
#tv iframe{width:560px;height:350px;border:0;display:block;background:#000}
.tvbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:rgba(14,15,20,.85);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12px}
.tvbar{flex-wrap:wrap;max-width:calc(100% - 20px)}
.tvbar input[type=range]{width:90px;accent-color:var(--accent)}
.voltxt{font-family:var(--mono);min-width:22px;color:var(--muted)}
.tvhint{color:var(--warn)}
.tvbar button{background:#1d2028;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.tvbar button:hover{border-color:var(--muted)}
#tvDlg input{width:100%}
.big{width:min(960px,100%);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.big iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.big button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.vsec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.vsec h4{margin:0;font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.vrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:13px}
@media (max-width:560px){.vrow{grid-template-columns:auto 1fr}}
.vbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.vbtns a,.vbtns button{background:#1d2028;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink);text-decoration:none}
#out video{width:100%;border-radius:8px;background:#000;display:block}
#tv video{width:560px;height:350px;display:block;background:#000;object-fit:contain}
.big video{width:100%;max-height:80vh;border-radius:12px;background:#000}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){#needYou{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>AI 視覺辦公室 <span id="mode" class="mode">連線中…</span></h1>
    <div class="hdr-r"><button id="needYou" hidden type="button">有人卡住了，找你</button><button id="openSettings" type="button" class="ghost">AI 設定</button></div>
  </header>
  <div class="layout">
    <main>
      <form class="cmd" id="cmdForm">
        <label for="cmd">給團隊</label>
        <input id="cmd" autocomplete="off" placeholder="一句話派工，例如：幫新開的手搖飲店規劃開幕週 IG 宣傳">
        <button id="dispatch" type="submit">→ 派工</button>
      </form>
      <div class="chips" id="examples"></div>
      <div class="stats" id="stats"></div>
      <div class="stage" id="stage"><canvas id="office" width="780" height="540" aria-label="等角視角的辦公室，AI 員工在裡面走動與工作"></canvas>
        <div id="tv" hidden><video id="tvVideo" playsinline loop hidden></video><iframe id="tvFrame" title="辦公室電視" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
        <div class="tvbar" id="tvBar" hidden><span>📺</span><button type="button" id="tvMute" aria-label="靜音切換">🔊</button><label class="vh" for="tvVol">音量</label><input type="range" id="tvVol" min="0" max="100" step="1" value="60"><span id="tvVolTxt" class="voltxt">60</span><button type="button" id="tvBigBtn">放大看</button><button type="button" id="tvChange">換頻道</button><button type="button" id="tvOff">關電視</button></div>
      </div>
      <div class="cards" id="cards"></div>
    </main>
    <aside>
      <section class="panel">
        <h2>交付成果 <button id="copy" type="button">複製</button></h2>
        <div class="tabs" id="tabs"></div>
        <div id="out"><p class="empty">派一個任務，產出會出現在這裡。點下方員工卡片可以看個別成員的產出。</p></div>
      </section>
      <section class="panel">
        <h2>活動紀錄</h2>
        <ol id="log"></ol>
      </section>
    </aside>
  </div>
  <p class="note" id="note"></p>
</div>
<div id="settings" class="ovl" hidden>
  <div class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h3 id="sTitle">AI 設定</h3>
    <div class="sgrid">
      <label for="sApi">後端網址<small>網頁和後端在同一個 Vercel 專案就留空</small></label><input id="sApi" placeholder="https://你的專案.vercel.app">
      <label for="sTok">存取密碼<small>Vercel 環境變數 OFFICE_TOKEN 的值</small></label><input id="sTok" type="password" autocomplete="off">
    </div>
    <div id="sAgents"></div>
    <div class="vsec">
      <h4>🎬 Jackson 真的產出影片（Google Veo）</h4>
      <label class="chk" for="vOn"><input type="checkbox" id="vOn"> 派到 Jackson 的影片任務，自動生成每個鏡頭並合併成一支影片</label>
      <div class="vrow"><label for="vModel">影片模型</label><select id="vModel"></select>
        <label for="vAspect">畫面</label><select id="vAspect"><option value="16:9">16:9 橫式</option><option value="9:16">9:16 直式（短影音）</option></select></div>
      <p class="note" style="margin:0">需要 Gemini 金鑰開啟付費。每次生成前，Jackson 都會先報價給你按同意。</p>
    </div>
    <p class="note" id="sMsg"></p>
    <div class="row"><button id="sLoad" type="button">讀取可用模型</button><span style="flex:1"></span><button id="sCancel" type="button">取消</button><button id="sSave" class="pri" type="button">儲存並連線</button></div>
  </div>
</div>
<svg id="wire" aria-hidden="true"></svg>
<div id="tvDlg" class="ovl" hidden>
  <div class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="tvTitle">
    <h3 id="tvTitle">辦公室電視</h3>
    <label for="tvUrl" style="font-size:13px">貼上 YouTube 網址（影片、Shorts、直播或播放清單都可以）</label>
    <input id="tvUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    <p class="note" id="tvMsg">播放時會有聲音，音量用左下角的滑桿調。少數影片被上傳者禁止嵌入，會顯示無法播放。</p>
    <div class="row"><button type="button" id="tvCancel">取消</button><button type="button" id="tvPlay" class="pri">開始播放</button></div>
  </div>
</div>
<div id="tvBig" class="ovl" hidden>
  <div class="big">
    <video id="tvBigVideo" controls playsinline hidden></video><iframe id="tvBigFrame" title="放大播放" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <button type="button" id="tvBigClose">關閉放大，回到牆上</button>
  </div>
</div>
<div id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">卡住了</h3>
    <p id="mQ"></p>
    <label for="mA" class="rl" style="font-size:12px;color:var(--muted)">你的回覆</label>
    <textarea id="mA"></textarea>
    <div class="row">
      <button type="button" id="mSkip">你自己判斷</button>
      <button type="button" id="mSend" class="pri">回覆</button>
    </div>
  </div>
</div>
<script>
/* ================= constants & helpers ================= */
const W=780,H=540,TW=56,TH=28,GW=14,GH=12,WALL=118,OX=362,OY=150;
const cv=document.getElementById('office');
const ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
const iso=(x,y,z=0)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2-z];
function shade(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function drawBox(x,y,w,d,h,col,z=0){const z1=z+h;
  poly([iso(x,y+d,z),iso(x+w,y+d,z),iso(x+w,y+d,z1),iso(x,y+d,z1)],shade(col,-.18),'rgba(0,0,0,.25)');
  poly([iso(x+w,y,z),iso(x+w,y+d,z),iso(x+w,y+d,z1),iso(x+w,y,z1)],shade(col,-.38),'rgba(0,0,0,.25)');
  poly([iso(x,y,z1),iso(x+w,y,z1),iso(x+w,y+d,z1),iso(x,y+d,z1)],col,'rgba(0,0,0,.18)');}
const faceL=(x,y,w,d,z1,z2,pad=0)=>[iso(x+pad,y+d,z1),iso(x+w-pad,y+d,z1),iso(x+w-pad,y+d,z2),iso(x+pad,y+d,z2)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= team ================= */
const TEAM=[
 {id:'Alfred',role:'主管',desc:'拆解任務、分派、整合交付',skin:'#f1c9a5',hair:'#3b2a20',shirt:'#e0663f',acc:'#ff7a59',desk:[3.0,1.3]},
 {id:'Curry',role:'研究',desc:'蒐集資料、市場與競品分析、整理事實',skin:'#e8b48f',hair:'#d9a441',shirt:'#3e7bd6',acc:'#5aa2ff',desk:[0.8,1.3]},
 {id:'Michel',role:'文案',desc:'撰寫文案、貼文、標題、腳本台詞',skin:'#f5d3b5',hair:'#2a1d1a',shirt:'#d65b9a',acc:'#ff7ab8',desk:[0.8,3.6]},
 {id:'Mia',role:'設計',desc:'視覺提案、版面、配色、出圖提示詞（產出設計規格，不直接出圖）',skin:'#f1c9a5',hair:'#7a4fd0',shirt:'#8a6ae8',acc:'#a98bff',desk:[3.0,3.6]},
 {id:'Jackson',role:'剪輯',desc:'短影音分鏡、剪輯節奏、字幕與配樂建議（產出分鏡表，不直接剪片）',skin:'#e8b48f',hair:'#c2552f',shirt:'#e3a43a',acc:'#ffc35a',desk:[5.2,3.6]},
 {id:'John',role:'審查',desc:'審查所有產出，抓錯、補漏、給修改建議',skin:'#f5d3b5',hair:'#1f3b3a',shirt:'#36a58a',acc:'#4fd1a9',desk:[5.2,1.3]},
];
const byId={};TEAM.forEach(t=>byId[t.id]=t);
const STATUS={
 idle:{t:'待命',c:'#6b7080'},walk:{t:'前往座位',c:'#5aa2ff'},work:{t:'工作中',c:'#5aa2ff'},
 plan:{t:'拆解任務',c:'#ff7a59'},queue:{t:'等待前置',c:'#ffb547'},wait:{t:'督導中',c:'#ffb547'},review:{t:'審查中',c:'#4fd1a9'},
 stuck:{t:'卡住，找你',c:'#ff5b4f'},done:{t:'已產出',c:'#4fd1a9'},err:{t:'出錯',c:'#ff5b4f'}};
const BUSY=new Set(['walk','work','plan','review','wait','queue']);

/* ================= furniture ================= */
const items=[];const solids=[];
function add(key,draw,solid){items.push({key,draw});if(solid)solids.push(solid);}
function boxItem(x,y,w,d,h,col,extra,solid=true,z=0){add(x+w/2+y+d/2,()=>{drawBox(x,y,w,d,h,col,z);extra&&extra();},solid?[x,y,w,d]:null);}
const snap=v=>Math.floor(v*2)/2+.25;
TEAM.forEach(a=>{
  const [dx,dy]=a.desk;a.seat=[snap(dx+.9),snap(dy+.9+.3)];
  boxItem(dx,dy,1.8,.9,16,'#b48a5e',()=>{ // keyboard
    poly([iso(dx+.6,dy+.55,16.5),iso(dx+1.2,dy+.55,16.5),iso(dx+1.2,dy+.75,16.5),iso(dx+.6,dy+.75,16.5)],'#2c2f38');});

/* ================= pathfinding ================= */
const R=2,CW=GW*R,CH=GH*R;const blocked=new Uint8Array(CW*CH);
solids.forEach(([x,y,w,d])=>{for(let i=0;i<CW;i++)for(let j=0;j<CH;j++){const cx=i/R,cy=j/R;
  if(cx<x+w&&cx+1/R>x&&cy<y+d&&cy+1/R>y)blocked[j*CW+i]=1;}});
TEAM.forEach(a=>{blocked[Math.floor(a.seat[1]*R)*CW+Math.floor(a.seat[0]*R)]=0;});
SOFA_SEATS.forEach(([x,y])=>{const j=Math.floor(y*R);blocked[j*CW+Math.floor(x*R)]=0;blocked[j*CW+Math.floor((x-.5)*R)]=0;});
function cellOf(x,y){return [Math.max(0,Math.min(CW-1,Math.floor(x*R))),Math.max(0,Math.min(CH-1,Math.floor(y*R)))];}
function findPath(x0,y0,x1,y1){
  const [si,sj]=cellOf(x0,y0),[gi,gj]=cellOf(x1,y1);const prev=new Int32Array(CW*CH).fill(-1);
  const s=sj*CW+si,g=gj*CW+gi;const q=[s];prev[s]=s;
  while(q.length){const c=q.shift();if(c===g)break;const ci=c%CW,cj=(c/CW)|0;
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const ni=ci+di,nj=cj+dj;if(ni<0||nj<0||ni>=CW||nj>=CH)continue;
      const n=nj*CW+ni;if(prev[n]!==-1||(blocked[n]&&n!==g))continue;prev[n]=c;q.push(n);}}
  if(prev[g]===-1)return [[x1,y1]];
  const out=[];let c=g;while(c!==s){out.push([(c%CW+.5)/R,(((c/CW)|0)+.5)/R]);c=prev[c];}
  out.reverse();out.push([x1,y1]);return out;}

  outputs:[],face:'down',sitting:false,emoji:s.e,spot:s,idleT:rnd(1,6),walking:false,onArrive:null,mode:'idle'});});
function goTo(a,x,y,cb){a.path=findPath(a.x,a.y,x,y);a.onArrive=cb||null;a.sitting=false;a.emoji=null;}
function toDesk(a,cb){a.mode='desk';goTo(a,a.seat[0],a.seat[1],()=>{a.sitting=true;a.face='up';cb&&cb();});}

function update(a,dt){
  if(a.path.length){const [tx,ty]=a.path[0];const dx=tx-a.x,dy=ty-a.y,dist=Math.hypot(dx,dy),sp=2.4*dt;
    a.walking=true;a.face=(dx+dy)<-0.001?'up':'down';
    if(dist<=sp){a.x=tx;a.y=ty;a.path.shift();if(!a.path.length){a.walking=false;a.face='down';const cb=a.onArrive;a.onArrive=null;cb&&cb();}}
    else{a.x+=dx/dist*sp;a.y+=dy/dist*sp;}
    return;}
  a.walking=false;
  if(a.mode==='idle'){a.idleT-=dt;if(a.idleT<=0){
    const taken=new Set(TEAM.filter(b=>b!==a).map(b=>b.spot));
    const freeTV=tvState.on?TV_SPOTS.filter(s=>!taken.has(s)):[];
    let s;
    if(freeTV.length&&Math.random()<.6)s=freeTV[(Math.random()*freeTV.length)|0];
    else{const opts=SPOTS.filter(x=>!taken.has(x)&&!(tvState.on&&x.nearTV));s=opts[(Math.random()*opts.length)|0];}
    a.spot=s;goTo(a,s.x,s.y,()=>{const watching=tvState.on&&s.tv;a.emoji=watching?s.tvE:s.e;a.sitting=!!s.sit;
      a.face=watching?'up':'down';a.idleT=watching?rnd(14,26):rnd(6,14);});}}
}

  const [ax,ay]=iso(p.from.x,p.from.y,40),[bx,by]=iso(p.to.x,p.to.y,40);const mx=(ax+bx)/2,my=Math.min(ay,by)-60;

/* ================= render loop ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;perfT+=dt;
  TEAM.forEach(a=>update(a,dt));
  ctx.clearRect(0,0,W,H);drawRoom();
  const list=items.map(it=>({k:it.key,d:it.draw})).concat(TEAM.map(a=>({k:(a.sitting&&a.spot&&a.spot.sit&&a.mode==='idle')?a.x+a.y+1.6:a.x+a.y+(a.sitting?.02:0),d:()=>drawAgent(a)})));
  list.sort((p,q)=>p.k-q.k).forEach(o=>o.d());
  // lamp glow
  const [gx,gy]=iso(6.2,8.5,52);const gr=ctx.createRadialGradient(gx,gy,2,gx,gy,90);gr.addColorStop(0,'rgba(255,220,150,.22)');gr.addColorStop(1,'rgba(255,220,150,0)');
  ctx.fillStyle=gr;ctx.fillRect(gx-90,gy-90,180,180);
  drawPackets(dt);
  TEAM.slice().sort((p,q)=>(p.x+p.y)-(q.x+q.y)).forEach(drawTag);
  requestAnimationFrame(frame);}

function md(src){
  const lines=String(src).replace(/\r/g,'').split('\n');let html='',list=null,tbl=null;

  const close=()=>{if(list){html+=`</${list}>`;list=null;}if(tbl){html+='</table>';tbl=null;}};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){if(/^\s*\|[\s:\-|]+\|\s*$/.test(l))continue;if(list){html+=`</${list}>`;list=null;}
      if(!tbl){html+='<table>';tbl=1;}const cells=l.trim().slice(1,-1).split('|');html+='<tr>'+cells.map(c=>`<td>${inline(c.trim())}</td>`).join('')+'</tr>';continue;}
    if(tbl){html+='</table>';tbl=null;}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){close();html+=`<h${m[1].length+1}>${inline(m[2])}</h${m[1].length+1}>`;}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){close();html+='<ul>';list='ul';}html+=`<li>${inline(m[1])}</li>`;}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();html+='<ol>';list='ol';}html+=`<li>${inline(m[1])}</li>`;}
    else if(!l.trim()){close();}

  close();return html;}

function ytEmbed(url,{mute=false,start=0}={}){
  url=String(url||'').trim();if(!url)return null;let id=null,list=null;
  try{const u=new URL(url.startsWith('http')?url:'https://'+url);const h=u.hostname.replace(/^www\.|^m\./,'');

    else if(/youtube(-nocookie)?\.com$/.test(h)){id=u.searchParams.get('v');
      const m=u.pathname.match(/^\/(shorts|live|embed)\/([\w-]{6,})/);if(m)id=m[2];}
  }catch{ if(/^[\w-]{11}$/.test(url))id=url; }
  if(id&&!/^[\w-]{6,}$/.test(id))id=null;
  if(!id&&!list)return null;
  const q=new URLSearchParams({autoplay:'1',playsinline:'1',rel:'0',mute:mute?'1':'0',enablejsapi:'1',origin:location.origin});
  if(start>2)q.set('start',String(Math.floor(start)));
  if(list)q.set('list',list);else{q.set('loop','1');q.set('playlist',id);}
  return 'https://www.youtube-nocookie.com/embed/'+(id||'videoseries')+'?'+q.toString();}

async function api(path,opt={}){const r=await fetch(apiURL(path),Object.assign({headers:hdrs()},opt));

async function fetchClip(uri){let start=0,total=Infinity,tries=0;const parts=[];
  while(start<total){const r=await fetch(apiURL('/api/video/file?uri='+encodeURIComponent(uri)+'&start='+start),{headers:hdrs()});
    if(r.status===409&&tries++<36){await sleep(5000);continue;}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||('下載失敗 HTTP '+r.status));}
    total=+r.headers.get('X-Total-Size')||0;const b=await r.arrayBuffer();if(!b.byteLength)break;parts.push(b);start+=b.byteLength;}
  return URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));}
async function genClip(prompt,onState){
  const first=/veo/.test(cfg.video.model)?prompt:'An 8-second video. '+prompt;
  const r0=await api('/api/video/start',{method:'POST',body:JSON.stringify({model:cfg.video.model,prompt:first,aspect:cfg.video.aspect})});
  if(r0.uri)return await fetchClip(r0.uri);
  const op=r0.op;
  const t0=Date.now();
  while(Date.now()-t0<9*60*1000){await sleep(9000);const st=await api('/api/video/status?op='+encodeURIComponent(op));onState&&onState((Date.now()-t0)/60000);

const once=(el,ev)=>new Promise(r=>el.addEventListener(ev,r,{once:true}));
function srtTime(t){const ms=Math.round(t*1000),h=ms/3600000|0,m=ms/60000%60|0,s=ms/1000%60|0,x=ms%1000;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(x).padStart(3,'0')}`;}
async function mergeClips(clips,onProg){
  const mk=()=>{const v=document.createElement('video');v.playsInline=true;v.preload='auto';return v;};
  const A=mk(),B=mk();A.src=clips[0].url;await once(A,'loadedmetadata');
  const Wd=A.videoWidth||1280,Hd=A.videoHeight||720;const c=document.createElement('canvas');c.width=Wd;c.height=Hd;const g=c.getContext('2d');
  const ac=new AudioContext();await ac.resume();const dest=ac.createMediaStreamDestination();
  [A,B].forEach(v=>ac.createMediaElementSource(v).connect(dest));
  const stream=new MediaStream([...c.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
  const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));

  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6e6});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  let cur=A,nxt=B,sub='';const fs=Math.round(Hd*.05);

    if(sub){g.font=`700 ${fs}px "Noto Sans TC",sans-serif`;g.textAlign='center';g.textBaseline='bottom';g.lineWidth=fs*.18;g.strokeStyle='rgba(0,0,0,.85)';

      const t=await ai(A,planPrompt(cmd,notes),p=>A.progress=p);
      if(t===null){await fakeRun(p=>A.progress=p,2500);plan=demoPlan(cmd);}else plan=parseJSON(t);
      if(plan.needs_user&&tries<2){const ans=await askUser(A,plan.needs_user);setStatus(A,'plan','重新拆解');notes+=(notes?'；':'')+(ans||'請自行判斷');continue;}
      break;}
  }catch(e){log('Alfred','拆解任務失敗：'+(e.message||e.code||e));setStatus(A,'err','拆解失敗');return end();}
  let subs=(plan.subtasks||[]).filter(s=>byId[s.agent]&&s.agent!=='Alfred'&&s.agent!=='John').slice(0,4);
  if(!subs.length){log('Alfred','這個任務沒有可以分派的子任務。');setStatus(A,'idle','');return end();}
  log('Alfred',plan.summary||'分派完成');A.progress=1;setStatus(A,'wait','督導 '+subs.length+' 個子任務');
  subs.forEach(s=>{const a=byId[s.agent];sendPacket(A,a,a.acc);a.progress=0;if(!a.arrive)a.arrive=new Promise(r=>toDesk(a,r));
    const deps=(s.depends_on||[]).filter(d=>subs[d]);setStatus(a,deps.length?'queue':'walk',deps.length?`${s.title}（等 ${deps.map(d=>subs[d].agent).join('、')}）`:s.title);});
  // run with dependencies, one job at a time per person
  const done=subs.map(()=>{let r;const p=new Promise(x=>r=x);return {p,r};});const chain={};
  subs.forEach((s,i)=>{const a=byId[s.agent];
    const job=async()=>{await Promise.all((s.depends_on||[]).filter(d=>d>=0&&d<subs.length&&d!==i).map(d=>done[d].p));
      const ctxs=(s.depends_on||[]).map(d=>deliverables.find(x=>x.idx===d)).filter(Boolean);
      await a.arrive;
      setStatus(a,'work',s.title);a.progress=.03;if(mode==='live')log(a.id,`用 ${modelLabel(a)} 開工：${s.title}`);const slot={idx:i,who:a.id,title:s.title,text:''};
      let extra='';
      try{for(let k=0;k<3;k++){
        const t=await ai(a,workPrompt(a,cmd,s,ctxs,[notes,extra].filter(Boolean).join('；')),p=>a.progress=p);
        let text=t;if(t===null){await fakeRun(p=>a.progress=p);text=demoText(a.id,s.title,cmd);}
        const m=text.trim().match(/^NEED_USER[:：]\s*(.+)/);
        if(m&&k<2){const ans=await askUser(a,m[1]);extra+=(extra?'；':'')+(ans||'請自行做合理假設');setStatus(a,'work',s.title);a.progress=.05;continue;}
        slot.text=text;break;}
        deliverables.push(slot);
        if(a.id==='Jackson'&&videoOn()){renderOut();try{await makeVideo(a,cmd,s,slot);}catch(e){log(a.id,'影片生成中斷：'+(e.message||e));}}
        a.progress=1;setStatus(a,'done',s.title);log(a.id,`完成「${s.title}」`);renderOut();
      }catch(e){a.progress=0;setStatus(a,'err',s.title);log(a.id,`「${s.title}」失敗：${e.code==='rate_limited'?'呼叫太頻繁，稍後再試':(e.message||e.code||e)}`);}
      done[i].r();};
    chain[a.id]=(chain[a.id]||Promise.resolve()).then(job);});
  await Promise.all(Object.values(chain));
  if(!deliverables.length){log('Alfred','沒有任何產出，任務中止。');setStatus(A,'err','沒有產出');return end();}
  // review
  const E=byId.John;sendPacket(A,E,E.acc);setStatus(E,'walk','審查產出');await (E.arrive=new Promise(r=>toDesk(E,r)));setStatus(E,'review','審查 '+deliverables.length+' 份產出');
  let rv;try{rv=await ai(E,reviewPrompt(cmd,deliverables),p=>E.progress=p);}catch(e){rv=null;log('John','審查失敗，略過審查。');}
  if(rv===null){await fakeRun(p=>E.progress=p,3000);rv='## 審查意見\n**整體評分 7/10**\n- 數字需要查證來源\n- 文案和視覺語氣要統一\n- 補上明確的行動呼籲\n\n可以交付，建議依上面三點微調。';}
  deliverables.push({idx:-1,who:'John',title:'審查意見',text:rv});E.progress=1;setStatus(E,'done','審查完成');log('John','審查完成');renderOut();
  // final
  setStatus(A,'plan','整合交付');A.progress=.05;
  let fin;try{fin=await ai(A,finalPrompt(cmd,deliverables.filter(d=>d.who!=='John'),rv),p=>A.progress=p);}catch(e){fin=null;log('Alfred','整合失敗，改為直接附上各成員產出。');}
  if(fin===null)fin=`## 交付摘要\n任務「${cmd}」已完成，以下是各成員產出（示範模式）。\n\n`+deliverables.map(d=>d.text).join('\n\n');
  finalText=fin;viewing='final';A.progress=1;setStatus(A,'done','已交付');log('Alfred','交付完成，請過目。');renderOut();
  end();}
function end(){running=false;document.getElementById('dispatch').disabled=false;
  setTimeout(()=>{if(running)return;TEAM.forEach(a=>{if(a.status!=='stuck'){release(a);a.sitting=false;a.status='idle';}});refreshCards();},6000);}
document.getElementById('cmdForm').addEventListener('submit',e=>{e.preventDefault();if(running)return;const v=document.getElementById('cmd').value.trim();
  if(!v){document.getElementById('cmd').focus();return;}mission(v);});
const EX=['幫新開的手搖飲店規劃開幕週 IG 宣傳','把我們的新品寫成 30 秒短影音腳本','研究台灣露營用品市場，寫一篇部落格文章'];
document.getElementById('examples').innerHTML=EX.map(x=>`<button type="button">${x}</button>`).join('');
document.querySelectorAll('#examples button').forEach(b=>b.onclick=()=>{document.getElementById('cmd').value=b.textContent;});
refreshCards();renderOut();
</script>
